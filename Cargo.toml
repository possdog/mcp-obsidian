[package]
name = "mcp-obsidian"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
clap = { version = "4.6.7", features = ["derive", "env"] }
notify = "8.2.0"
regex = "1.13.1"
rmcp = { version = "3.4.1", features = ["client", "server", "transport-streamable-http-server"] }
serde = { version = "1.0.229", features = ["derive"] }
# Parsing .obsidian/daily-notes.json for daily-note folder auto-detection;
# rmcp already links serde_json, so this adds no new code to the binary.
serde_json = "1.0"
serde_yaml_ng = "0.10.0"
tantivy = "0.26.2"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.16"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
walkdir = "2.5.0"

[dev-dependencies]
# reqwest is only used by the end-to-end HTTP tests; the rmcp feature pulls in
# the reqwest-based streamable HTTP client transport for round-trip testing.
reqwest = { version = "0.13", default-features = false }
rmcp = { version = "3.4.1", features = ["transport-streamable-http-client-reqwest"] }
serde_json = "1.0"
